micronaut:
  application:
    name: ontology-annotation-network
  server:
    context-path: /api/network
    cors:
      enabled: true
  router:
    static-resources:
      swagger:
        mapping: /api/network/**
        paths: classpath:META-INF/swagger
      swagger-ui:
        mapping: /api/network/docs/**
        paths: classpath:META-INF/swagger/views/swagger-ui
  serde:
    serialization:
      inclusion: ALWAYS
endpoints:
  all:
    path: monitor/
sqlite:
  path: ./oan.db
