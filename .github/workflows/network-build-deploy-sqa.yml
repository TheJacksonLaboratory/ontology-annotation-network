name: Build & Deploy Ontology Annotation Network (SQA)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build and deploy to SQA
        required: true
        default: feature/hpo-167-combined-build-deploy
env:
  GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
  GCLOUD_REGION: us-east1
  GCLOUD_GCR: us-docker.pkg.dev
  GCLOUD_REGISTRY_PROJECT_ID: ${{ secrets.GCLOUD_REGISTRY_PROJECT_ID }}
  GCLOUD_REGISTRY_IMAGE_ENV: docker
  GCLOUD_REGISTRY_IMAGE_PROJECT: ontology
  SERVICE_NAME: ontology-annotation-network-rest-sqa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCLOUD_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Get project version
        run: |
          echo "PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)-sqa-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "MVN_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Set our docker image name
        run: |
          echo "DOCKER_IMAGE=$GCLOUD_GCR/$GCLOUD_REGISTRY_PROJECT_ID/$GCLOUD_REGISTRY_IMAGE_ENV/$GCLOUD_REGISTRY_IMAGE_PROJECT/$SERVICE_NAME" >> $GITHUB_ENV

      - name: Maven Package ETL
        run: mvn package -pl oan-etl -am -DskipTests=true

      - name: Fetch ontology data
        run: sh oan-etl/update.sh oan-etl/data/

      - name: Build the SQLite artifact
        run: |
          java -jar oan-etl/target/oan-etl-${MVN_VERSION}.jar -d oan-etl/data -o oan-rest/oan.db -t

      - name: Maven Package Rest
        run: mvn package -pl oan-rest -am -DskipTests=true

      - name: Docker Login
        run: |
          gcloud auth configure-docker "${GCLOUD_GCR}"

      - name: Build And Push Docker Image
        run: |
          cd oan-rest/
          docker build . --build-arg="VERSION_ARG=${MVN_VERSION}" --build-arg="MICRONAUT_ENV_ARG=prod" --tag="${DOCKER_IMAGE}:${PROJECT_VERSION}"
          docker push "${DOCKER_IMAGE}:${PROJECT_VERSION}"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME --quiet \
            --image "${DOCKER_IMAGE}:${PROJECT_VERSION}" --project "${GCLOUD_PROJECT_ID}" \
            --region "${GCLOUD_REGION}" --platform managed --allow-unauthenticated --format json \
            --memory 4Gi --cpu 2 --min-instances 0 --max-instances 2 --no-cpu-throttling --ingress internal-and-cloud-load-balancing --service-account "${GCLOUD_SERVICE_ACCOUNT}"
